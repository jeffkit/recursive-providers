name: Validate providers.json

on:
  push:
    paths: ['providers.json']
  pull_request:
    paths: ['providers.json']
  # Freshness watch: sync.yml pushes with GITHUB_TOKEN, and push events
  # triggered by GITHUB_TOKEN do not start new workflow runs — so this
  # scheduled run is what actually catches a stalled sync (stale
  # `updated_at`) instead of relying on the push trigger. Scheduled-run
  # failures notify the maintainer by email.
  schedule:
    # Daily at 08:30 UTC, after the 08:00 sync has landed.
    - cron: '30 8 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate structure and pricing sanity
        run: python3 scripts/validate_providers.py

      - name: Check catalog freshness
        if: github.event_name == 'schedule'
        run: python3 scripts/validate_providers.py --max-age-days 3
