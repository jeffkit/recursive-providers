name: Sync providers from LiteLLM

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-providers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync script
        run: python3 scripts/sync_providers.py

      # Gate BEFORE landing. validate.yml's `on: push` does not fire for
      # pushes made with GITHUB_TOKEN (GitHub suppresses recursive workflow
      # runs), so this in-workflow check is what actually guards main.
      - name: Validate providers.json
        run: python3 scripts/validate_providers.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet providers.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push straight to main instead of opening a PR: PRs created with
      # GITHUB_TOKEN require first-contribution approval before their
      # checks run, which left the old auto/sync-providers PR stuck in
      # `action_required` for two months while the catalog silently went
      # stale (jeffkit/recursive-providers#3). Data is validated above
      # before it can land.
      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers.json
          git commit -m "chore(sync): update pricing from LiteLLM"
          git push origin HEAD:main

      # No more silent drift: a failed or blocked sync leaves a visible
      # issue on the repo (commented on if one is already open), and the
      # scheduled validate.yml run independently flags a stale catalog.
      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="sync: daily LiteLLM sync failed"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="Daily sync failed at \`${stamp}\`.<br>Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label automated \
              || gh issue create --title "$title" --body "$body"
          fi
